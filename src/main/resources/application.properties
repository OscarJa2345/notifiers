spring.application.name=notifiers
server.port=${PORT:8080}

# =============================================
# Kafka (Aiven). Para pruebas locales sin Aiven:
#   KAFKA_SECURITY_PROTOCOL=PLAINTEXT  KAFKA_BOOTSTRAP_SERVERS=localhost:9092
# =============================================
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topic=${KAFKA_TOPIC:notificaciones}
kafka.group-id=${KAFKA_GROUP_ID:notifiers-group}
kafka.security-protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
kafka.sasl-mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
kafka.username=${KAFKA_USERNAME:}
kafka.password=${KAFKA_PASSWORD:}
kafka.ca-cert=${KAFKA_CA_CERT:}
kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}

# =============================================
# Brevo (API HTTP, no SMTP)
# =============================================
brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.api-key=${BREVO_API_KEY:}
brevo.from.address=${BREVO_FROM_ADDRESS:}
brevo.from.name=${BREVO_FROM_NAME:Gestion de Usuarios}
